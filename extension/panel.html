<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>renga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
</head>
<body>

<!-- five regions stack down the panel. the header, the tabs and the live
     rail are pinned, the composer is pinned to the bottom and grows upward,
     and only the thread scrolls. -->
<header class="head">
  <label for="team" class="sr">team</label>
  <span class="title-wrap"><select id="team" class="title" disabled></select></span>
  <span class="conn" id="conn" title="connecting"><i></i><span class="sr">connecting</span></span>
  <button type="button" id="expand" class="icon-btn" title="open in a tab" aria-label="open in a tab" hidden>
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2H2v4M10 14h4v-4M2 10v4h4M14 6V2h-4"/>
    </svg>
  </button>
</header>

<nav id="tabs" class="tabs" aria-label="rooms"></nav>

<!-- the live rail is built into here while a call is being captured, and
     removed from the dom when there is none. it never collapses to an
     empty state. -->
<div id="rail-slot"></div>

<div id="error" class="err" role="alert" hidden></div>

<div id="log" class="thread" aria-live="polite"></div>

<div id="thinking" class="thinking" role="status" aria-live="polite" hidden></div>

<form id="composer" class="composer">
  <div id="menu" class="menu" role="menu" aria-label="attach" hidden></div>
  <div class="row">
    <button type="button" id="attach" class="plus" aria-expanded="false" aria-controls="menu" aria-label="attach" hidden>
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M8 3v10M3 8h10"/>
      </svg>
    </button>
    <label for="c-input" class="sr">message</label>
    <input type="text" id="c-input" placeholder="message, or paste a link…" autocomplete="off">
    <button type="submit" id="send" class="send" disabled>send</button>
  </div>
  <p id="dest" class="dest"></p>
</form>

<script src="panel.js"></script>
<script src="thinking.js"></script>
</body>
</html>
