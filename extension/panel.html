<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>renga</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
</head>
<body>

<header class="top">
  <span class="wordmark">renga</span>
  <label for="team" class="sr">team</label>
  <select id="team" class="team-pick" disabled></select>
  <span class="conn" id="conn" title="connecting"><i></i><span class="sr">connecting</span></span>
</header>

<!-- what this team's agents can take in. each line shows only when the team
     has an agent with that sense. -->
<div id="listen" class="listen" role="status" hidden></div>
<div id="look" class="look" hidden>
  <button type="button" id="read-screen" class="read-btn"></button>
  <span id="look-note" class="look-note"></span>
</div>
<p id="deaf" class="deaf" hidden>no agent in this team reads the screen or hears calls. add one when you make a team.</p>

<nav id="rooms" class="rooms" aria-label="rooms"></nav>

<div id="error" class="err" role="alert" hidden></div>

<div id="log" class="log" aria-live="polite"></div>

<form id="composer" class="composer">
  <label for="c-input" class="sr">message</label>
  <input type="text" id="c-input" placeholder="message #meeting" autocomplete="off">
  <button type="submit">send</button>
</form>

<script src="panel.js"></script>
</body>
</html>
