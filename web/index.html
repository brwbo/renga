<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>renga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">
  <aside class="side" aria-label="rooms">
    <div class="brand">
      <span class="wordmark">renga</span>
      <span class="conn" id="conn" title="connecting"><i></i><span class="sr">connecting</span></span>
    </div>

    <h2 class="label">rooms</h2>
    <nav id="rooms" class="rooms"></nav>

    <h2 class="label">in this room</h2>
    <ul id="members" class="members"></ul>
  </aside>

  <main class="room">
    <header class="room-head">
      <h1 id="room-name">meeting</h1>
      <p id="room-purpose" class="purpose"></p>
    </header>

    <div id="error" class="err" role="alert" hidden></div>

    <div id="log" class="log" aria-live="polite"></div>

    <form id="composer" class="composer">
      <label for="c-input" class="sr">message</label>
      <input type="text" id="c-input" placeholder="message the room" autocomplete="off">
      <button type="submit">send</button>
    </form>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
