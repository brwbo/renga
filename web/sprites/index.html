<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sprite designs v2</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --k0:#000; --k1:#555; --k2:#aaa; --k3:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:var(--k3); color:var(--k0); font-family:'VT323', monospace; font-size:20px; line-height:1;
    background-image: radial-gradient(var(--k2) 1px, transparent 1px); background-size: 6px 6px; }
  h1 { font-family:'Press Start 2P'; font-size:14px; margin:0 0 20px; text-transform:uppercase; }
  .win { background:var(--k3); border:1px solid var(--k0); box-shadow: inset 1px 1px 0 var(--k3), inset -1px -1px 0 var(--k1), 3px 3px 0 var(--k1); margin:0 0 22px; display:block; width:max-content; max-width:100%; }
  .bar { background:var(--k0); color:var(--k3); font-family:'Press Start 2P'; font-size:9px; padding:7px 8px; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center; background-image: repeating-linear-gradient(0deg, #000 0 2px, #444 2px 3px); }
  .bar span { background:#000; padding:2px 4px; }
  .bar b { display:inline-block; width:10px; height:10px; background:#fff; border:1px solid #000; box-shadow: inset -1px -1px 0 #555; }
  .body { padding:14px; }
  .row { display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap; }
  .cell { text-align:center; }
  .cell canvas { display:block; margin:0 auto 6px; image-rendering:pixelated; }
  .cap { font-size:18px; } .cap small { display:block; color:var(--k1); font-size:16px; }
  .scene { border:1px solid var(--k0); image-rendering:pixelated; }
</style>
</head>
<body>
<h1>sprite designs v2 — every job wears its job</h1>
<div id="root"></div>
<!-- the generator is sprites.js — this page renders it, it does not keep a second copy -->
<script src="palette.js"></script>
<script src="sprites.js"></script>
<script>
const { W, H, build, draw, palette, CAST, SKINS, ACCENTS, MONO, OUTFITS } = window.Sprites;

// ===== render =====
const root=document.getElementById('root'); const anim=[];
function win(title){ const w=document.createElement('div'); w.className='win'; w.innerHTML=`<div class="bar"><span>${title}</span><b></b></div><div class="body"><div class="row"></div></div>`; root.appendChild(w); return w.querySelector('.row'); }
function cell(row, spec, state, opts={}){ const scale=opts.scale||3; const c=document.createElement('div'); c.className='cell';
  const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale; c.appendChild(cv);
  const cap=document.createElement('div'); cap.className='cap'; cap.innerHTML=(opts.label||'')+(opts.sub?`<small>${opts.sub}</small>`:''); c.appendChild(cap); row.appendChild(c);
  anim.push({ctx:cv.getContext('2d'), spec, state, scale, pal:palette(spec), w:cv.width, h:cv.height}); }

let r=win('detail — pm at 8×'); cell(r, CAST[0], 'idle', {scale:8, label:'idle'}); cell(r, CAST[1], 'work', {scale:8, label:'backend typing'});
r=win('states — one character'); for(const [st,lab] of [['sleep','asleep'],['work','working'],['talk','talking'],['walk','walking'],['wait','waiting'],['error','error'],['idle','idle']]) cell(r, CAST[0], st, {label:lab});
r=win('the cast — each with their own way of working'); for(const s of CAST) cell(r, s, 'work', {label:s.name, sub:s.work});
r=win('the cast — asleep'); for(const s of CAST) cell(r, s, 'sleep', {label:s.name});
r=win('the wardrobe — one outfit per job'); for(const o of Object.keys(OUTFITS)) cell(r, {...CAST[0], outfit:o, hat:'none', face:'none', extra:'none'}, 'idle', {label:o});
r=win('headgear'); for(const h of ['beret','hardhat','eyeshade','cap']) cell(r, {...CAST[0], outfit:'coverall', hat:h, face:'none', extra:'none'}, 'idle', {label:h});
r=win('customise — hair'); for(const st of ['parted','buzz','long','bob','curly','bun','bald']) for(const hc of ['black','blonde']) cell(r, {...CAST[0], style:st, hair:hc, face:'none', extra:'none'}, 'idle', {label:st, sub:hc});
r=win('customise — skin × accent'); SKINS.forEach((_,i)=>{ const acc=Object.keys(ACCENTS)[i%7]; cell(r, {...CAST[0], skin:i, accent:acc, style:['parted','buzz','bob','curly','long'][i], hair:['black','brown','blonde','ginger','grey'][i]}, 'idle', {label:'skin '+i, sub:acc}); });
r=win('customise — face and extras'); for(const f of ['glasses','shades','tache','beard']) cell(r, {...CAST[0], face:f, extra:'none'}, 'idle', {label:f}); for(const e of ['headset','coffee','briefcase','lanyard']) cell(r, {...CAST[0], face:'none', extra:e}, 'idle', {label:e}); cell(r, {...CAST[0], tie:'bowtie', extra:'none'}, 'idle', {label:'bowtie'});

// floor scene
r=win('floor at 3× — everyone at their desk');
(function(){ const scale=3, SW=CAST.length*44+10, SH=64; const cv=document.createElement('canvas'); cv.width=SW*scale; cv.height=SH*scale; cv.className='scene'; const ctx=cv.getContext('2d');
  const wrap=document.createElement('div'); wrap.className='cell'; wrap.appendChild(cv); const cap=document.createElement('div'); cap.className='cap'; cap.textContent='desks stay on the ramp; only the people carry colour'; wrap.appendChild(cap); r.appendChild(wrap);
  const DESK=['.......##########...............','.......#wwwwwwww#...............','.......#wwwwwwww#...............','.......#wwwwwwww#...............','.......#wwwwwwww#...............','.......##########...............','.........######.................','################################','#oooooooooooooooooooooooooooooo#','################################','##............................##','##............................##','##............................##'].map(s=>s.split(''));
  anim.push({custom:true, tick:(f)=>{ ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle='#aaa'; for(let y=2;y<SH;y+=4) for(let x=2;x<SW;x+=4) ctx.fillRect(x*scale,y*scale,scale,scale);
    ctx.fillStyle='#000'; ctx.fillRect(0,(SH-4)*scale,cv.width,scale);
    CAST.forEach((s,i)=>{ const st = i===3? 'sleep' : i===0 ? 'talk' : 'work'; draw(ctx, build(s,st,f), scale, palette(s), (5+i*44)*scale, 2*scale);
      const dx=(5+i*44+2)*scale, dy=(SH-4-14)*scale; DESK.forEach((row,y)=>row.forEach((c,x)=>{ if(c==='.') return; ctx.fillStyle=MONO[c]; ctx.fillRect(dx+x*scale, dy+y*scale, scale, scale); })); }); } });
})();

let frame=0, last=0;
function tick(t){ if(t-last>140){ last=t; frame++; for(const a of anim){ if(a.custom){ a.tick(frame); continue; } a.ctx.clearRect(0,0,a.w,a.h); draw(a.ctx, build(a.spec,a.state,frame), a.scale, a.pal); } } requestAnimationFrame(tick); }
requestAnimationFrame(tick);
</script>
</body>
</html>
